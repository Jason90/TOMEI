[pytest]

# pytest.ini 配置文件
; # 设置 pytest 的日志级别
; log_cli_level = INFO
; # 设置 pytest 的日志格式
; log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
; # 设置 pytest 的日志日期格式
; log_date_format = %Y-%m-%d %H:%M:%S

# 指定测试用例的默认搜索路径（相对项目根目录）
testpaths = case
# 忽略的目录（不包含在测试搜索中）  
norecursedirs = .git venv dist
# 指定测试文件的匹配模式（默认是 test_*.py 或 *_test.py）
python_files = test_*.py check_*.py
# 指定测试类的匹配模式
python_classes = Test*
# 指定测试函数的匹配模式
python_functions = test_* check_*
# 生成 JUnit 风格的测试报告（方便 CI/CD 工具解析）
; addopts = --junitxml=report.xml -v
addopts = --html=report.html --self-contained-html

# 配置 pytest 的标记（markers），用于分类测试用例
markers =
    smoke: 冒烟测试（核心功能快速验证）
    slow: 耗时较长的测试
    integration: 集成测试
    api: API 接口测试


